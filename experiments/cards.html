<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liar's Crawl card lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<style>
:root{--display:"Jersey 10","Courier New",monospace;--body:"Jersey 10","Courier New",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0e11;color:#dcd6c6;font-family:var(--body);font-size:22px}
body{background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(0,0,0,.25) 31px 32px),repeating-linear-gradient(90deg,transparent 0 63px,rgba(0,0,0,.2) 63px 64px),radial-gradient(ellipse 70% 60% at 50% 35%,#2a2118,#0d0e11 75%)}
.slot.r-common { border-color: rgb(123, 127, 136); }
.slot.r-uncommon { border-color: rgb(63, 154, 75); }
.slot.r-rare { border-color: rgb(63, 118, 201); }
.slot.r-epic { border-color: rgb(138, 79, 196); }
.tcard { --cw: 160px; --rc: #a9b0b8; position: relative; box-sizing: border-box; width: var(--cw); height: calc(var(--cw) * 1.62); flex: 0 0 auto; display: flex; flex-direction: column; padding: 0.45em; font-size: calc(var(--cw) / 11); line-height: 1.15; color: rgb(243, 233, 207); background: linear-gradient(rgb(44, 34, 51), rgb(23, 18, 26)); border: .28em solid var(--rc); border-radius: 0.7em; box-shadow: rgb(11, 10, 9) 0px 0px 0px 0.18em, rgba(0, 0, 0, 0.65) 0px 0.5em 1.2em; user-select: none; }
.tcard.r-uncommon { --rc: #62c46d; }
.tcard.r-rare { --rc: #5f9df2; }
.tcard.r-epic { --rc: #b684ff; }
.tcard .tcname { text-align: center; font-family: var(--display); font-size: 1.55em; padding: 0.1em 0.2em; background: rgba(0, 0, 0, 0.4); border: .1em solid var(--rc); }
.tcard .tcart { flex: 0 0 30%; display: grid; place-items: center; margin: 0.4em 0px; background: radial-gradient(circle, rgb(67, 54, 74), rgb(18, 14, 21)); border: 0.12em solid rgb(11, 10, 9); overflow: hidden; }
.tcard .tcart svg { height: 82%; width: auto; image-rendering: pixelated; filter: drop-shadow(rgba(0, 0, 0, 0.6) 0px 0.15em 0px); }
.tcard .tctype { text-align: center; white-space: nowrap; font-size: 0.78em; letter-spacing: 0.06em; text-transform: uppercase; color: var(--rc); }
.tcard .tctxt { flex: 1 1 0%; margin-top: 0.35em; padding: 0.4em; background: rgba(0, 0, 0, 0.3); text-align: center; font-size: 1em; display: flex; flex-direction: column; justify-content: center; gap: 0.4em; min-height: 0px; overflow: hidden; }
.tcard .tcfl { font-style: italic; opacity: 0.6; font-size: 0.88em; }
.tcard .tcgem { position: absolute; top: -0.5em; left: -0.5em; width: 1.2em; height: 1.2em; background: var(--rc); transform: rotate(45deg); box-shadow: rgb(11, 10, 9) 0px 0px 0px 0.15em; }
.tcard .tctag { position: absolute; right: 0.4em; bottom: 0.3em; font-size: 0.75em; opacity: 0.5; }
.tcard.cantplay { filter: grayscale(0.8) brightness(0.7); }
.deckmodal .tcname, .deckmodal button { font-family: var(--display); }
.deckmodal .deckrow .tcard { --cw: 190px; transition: transform 0.12s; }
.deckmodal .deckrow .tcard:hover { transform: translateY(-8px) scale(1.06); }
.handtray .tcname { font-family: var(--display); }
.handtray .tcard { --cw: 150px; pointer-events: auto; margin: 0px -16px; transform-origin: 50% 120%; transform: translateY(-34px) rotate(var(--r, 0deg)); transition: transform 0.14s ease-out; touch-action: none; }
.handtray .tcard.canplay { cursor: grab; }
.handtray .tcard.overfield { box-shadow: rgb(11, 10, 9) 0px 0px 0px 0.18em, rgb(255, 211, 122) 0px 0px 2.4em; }
.handtray .tcard .tcfl { display: none; }
.handtray .tcard .tctype { font-size: 0.75em; letter-spacing: 0.04em; }
.handtray .tcard:hover .tcfl { display: block; }
.handtray .tcard:hover { transform: translateY(-150px) scale(1.55) rotate(0deg); z-index: 20; }
.handtray .tcard.played { animation: 0.45s ease-in 0s 1 normal forwards running cardplay; pointer-events: none; }
body.spelling ~ .handtray .tcard:hover { transform: translateY(-34px) rotate(var(--r, 0deg)); }
.cardreveal .tcname, .cardreveal .crcap { font-family: var(--display); }
.cardreveal .tcard { --cw: 270px; animation: 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) 0s 1 normal both running crpop; box-shadow: 0 0 0 .18em #0b0a09, 0 0 2.4em var(--rc), 0 .5em 1.2em rgba(0,0,0,.65); }
.btn.potionglow, .deckpile.potionglow, .tcard.potionglow { animation: 1.4s ease-in-out 0s infinite normal none running potionpulse; border-color: rgb(255, 138, 26) !important; }
.cardstall .tcard { --cw: 190px; }
.cardstall.sold .tcard { filter: grayscale(1) brightness(0.55); }
.card.k-sigil.r-common { --rb: #a3a8b3; }
.card.k-sigil.r-uncommon { --rb: #55c866; }
.card.k-sigil.r-rare { --rb: #5a97ec; }
.card.k-sigil.r-epic { --rb: #b684ff; }
.btn.r-common, .slot.r-common { --sb: #a3a8b3; }
.btn.r-uncommon, .slot.r-uncommon { --sb: #55c866; }
.btn.r-rare, .slot.r-rare { --sb: #5a97ec; }
.btn.r-epic, .slot.r-epic { --sb: #b684ff; }
.btn.r-common, .btn.r-uncommon, .btn.r-rare, .btn.r-epic { background: var(--sb) !important; }
.tcard.r-legendary { --rc: #ffb23d; }
.handtray .tcard { transform-origin: 50% 50% !important; }
.handtray .tcard:hover { z-index: 20; animation: 0.44s ease-out 0s 1 normal none running tcflip; transform: translateY(-34px) rotate(0deg) scale(1.34) !important; }
.handtray .tcard:hover .tcfl { display: block; }
@keyframes tcflip { 
  0% { transform: translateY(-34px) rotate(var(--r, 0deg)) perspective(900px) rotateY(0deg) scale(1); }
  46% { transform: translateY(-34px) rotate(0deg) perspective(900px) rotateY(90deg) scale(1.15); }
  54% { transform: translateY(-34px) rotate(0deg) perspective(900px) rotateY(-90deg) scale(1.2); }
  100% { transform: translateY(-34px) rotate(0deg) perspective(900px) rotateY(0deg) scale(1.34); }
}
html .handtray .tcard { margin: 0px -29px; transform: translateY(-4px) rotate(var(--r, 0deg)); transition: transform 0.16s ease-out, filter 0.16s ease-out; transform-origin: 50% 70% !important; }
html .handtray .tcard::after { top: 100%; }
html .handtray .tcard:hover { z-index: 20; transform: translateY(-82px) rotate(0deg) scale(1.42) !important; animation: auto ease 0s 1 normal none running none !important; }
html .handtray .tcard.canplay:hover { filter: drop-shadow(rgb(255, 243, 176) 0px 0px 0.3em) drop-shadow(rgb(255, 194, 58) 0px 0px 0.8em) brightness(1.1); }
html .handtray .tcard.cantplay:hover { filter: grayscale(0.5) brightness(0.9); }
html .handtray.deal .tcard { animation-duration: 0.42s; animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); animation-iteration-count: 1; animation-direction: normal; animation-fill-mode: backwards; animation-play-state: running; animation-name: handdeal; animation-timeline: auto; animation-range: normal; animation-delay: calc(var(--k, 0) * 30ms); }
.rptcardbtn .tcard { --cw: 150px; }
.looseseal.r-common { --rb: #a3a8b3; }
.looseseal.r-uncommon { --rb: #55c866; }
.looseseal.r-rare { --rb: #5a97ec; }
.looseseal.r-epic { --rb: #b684ff; }
.deckmodal .deckrow .tcard { --cw: 240px; }
.rptghost .tcard { --cw: 150px; }
.rptprev .tcard { --cw: 320px; }
.ware.r-uncommon { --rb: #55c866; }
.ware.r-rare { --rb: #5a97ec; }
.ware.r-epic { --rb: #b684ff; }
.ware .tcard { --cw: 138px; pointer-events: none; }
.rewseal.r-common { --rb: #a3a8b3; }
.rewseal.r-uncommon { --rb: #55c866; }
.rewseal.r-rare { --rb: #5a97ec; }
.rewseal.r-epic { --rb: #b684ff; }
.lcard .tcard { pointer-events: none; }
@keyframes tcflip2 { 
  0% { transform: translateY(-4px) rotate(var(--r, 0deg)) perspective(900px) rotateY(0deg); }
  46% { transform: translateY(-4px) rotate(var(--r, 0deg)) perspective(900px) rotateY(90deg); }
  54% { transform: translateY(-4px) rotate(var(--r, 0deg)) perspective(900px) rotateY(-90deg); }
  100% { transform: translateY(-4px) rotate(var(--r, 0deg)) perspective(900px) rotateY(0deg); }
}
@keyframes tcflip3 { 
  0% { transform: perspective(900px) rotateY(0deg); }
  46% { transform: perspective(900px) rotateY(90deg); }
  54% { transform: perspective(900px) rotateY(-90deg); }
  100% { transform: perspective(900px) rotateY(0deg); }
}
html .handtray .tcard:hover { z-index: 20; transform: translateY(-4px) rotate(var(--r, 0deg)) !important; animation: 0.5s ease-in-out 0s 1 normal none running tcflip2 !important; }
html .handtray .tcard.inspect, html .handtray .tcard.inspect:hover { z-index: 30; transform: translateY(-130px) rotate(0deg) scale(1.55) !important; animation: auto ease 0s 1 normal none running none !important; }
html .deckmodal .deckrow .tcard:hover { transform: none; animation: 0.5s ease-in-out 0s 1 normal none running tcflip3; }
html .deckmodal .deckrow .tcard.inspect, html .deckmodal .deckrow .tcard.inspect:hover { transform: scale(1.5); z-index: 30; animation: auto ease 0s 1 normal none running none; }
.deckmodal .deckrow .tcard { cursor: pointer; }
html .handtray .tcard { transform: translateY(calc(var(--y, 0px) - 10px)) rotate(var(--r, 0deg)); transform-origin: 50% 50% !important; }
html .handtray .tcard:hover, html .handtray .tcard.canplay:hover, html .handtray .tcard.cantplay:hover { z-index: 20; transform: translateY(calc(var(--y, 0px) - 34px)) rotate(var(--r, 0deg)) !important; animation: 0.5s ease-in-out 0s 1 normal none running tcflip2 !important; }
html .handtray .tcard.inspect, html .handtray .tcard.inspect:hover { z-index: 30; transform: translateY(-190px) rotate(0deg) scale(1.55) !important; animation: auto ease 0s 1 normal none running none !important; }
html .tcard.cantplay, html .handtray .tcard.cantplay, html .handtray .tcard.cantplay:hover { filter: none !important; }
html .handtray .tcard.cantplay { cursor: grab; }
html .handtray .tcard:hover, html .handtray .tcard.canplay:hover, html .handtray .tcard.cantplay:hover { animation: auto ease 0s 1 normal none running none !important; }
html .deckmodal .deckrow .tcard:hover { animation: auto ease 0s 1 normal none running none !important; }
html .handtray .tcard { transition: transform 0.12s ease-out !important; }
.tcard, .tcard *, .looseseal, .looseseal *, #satchelpanel, #satchelpanel *, .fi, .fi *, .spellarrow, .spellarrow * { -webkit-user-drag: none; user-select: none; }
.tcard, .looseseal, .fi { touch-action: none; }
html .handtray .tcard::before { content: ""; position: absolute; left: 0px; right: 0px; top: 100%; height: 70px; }
html .handtray:not(.ghostwrap) .tcard { --sx: 0px; transition: transform 0.16s ease-out, filter 0.16s ease-out, width 0.2s, margin 0.2s, opacity 0.15s !important; }
html .handtray .tcard { transform: translateX(var(--sx)) translateY(calc(var(--y, 0px) - 10px)) rotate(var(--r, 0deg)); }
html .handtray .tcard:hover, html .handtray .tcard.canplay:hover, html .handtray .tcard.cantplay:hover { z-index: 20; transform: translateX(var(--sx)) translateY(calc(var(--y, 0px) - 58px)) rotate(0deg) scale(1.14) !important; animation: auto ease 0s 1 normal none running none !important; }
html .handtray .tcard:has(~ .tcard:hover) { --sx: -26px; }
html .handtray .tcard:hover ~ .tcard { --sx: 26px; }
html .handtray .tcard::after { height: 80px !important; }
html .handtray .tcard.lifted { overflow: hidden; width: 0px !important; min-width: 0px !important; margin-left: -6px !important; margin-right: -6px !important; opacity: 0 !important; pointer-events: none !important; border-width: 0px !important; padding: 0px !important; }
html .handtray.ghostwrap .tcard { filter: drop-shadow(rgba(0, 0, 0, 0.6) 0px 14px 10px); }
html .handtray.deal .tcard, html .handtray .tcard, html .deckmodal .tcard { animation: auto ease 0s 1 normal none running none !important; }

.tcard { image-rendering: pixelated; border: 0px; padding: 0px; display: block; height: calc(var(--cw)*1.523); border-radius: calc(var(--cw)*.04); color: rgb(43, 27, 16); box-shadow: rgba(0, 0, 0, 0.6) 0px 0.4em 0.9em; }
.tcard .tcgem { display: none; }
.tcard .tcname { position: absolute; left: 19%; width: 62%; top: 5.6%; height: 9.6%; display: flex; align-items: center; justify-content: center; background: none; border: 0px; padding: 0px; font-size: min(1.28em,calc(var(--cw)*.78/var(--n,10))); line-height: 1; text-align: center; color: var(--nc); white-space: nowrap; overflow: hidden; text-shadow: none; }
.tcard .tcart { position: absolute; left: 15%; width: 70%; top: 17.9%; height: 37%; margin: 0px; background: none; border: 0px; display: grid; place-items: center; overflow: hidden; }
.tcard .tcart svg { height: 90%; width: auto; max-width: 94%; image-rendering: auto; filter: drop-shadow(rgba(0, 0, 0, 0.45) 0px 0.2em 0.15em); }
.tcard .tctype { position: absolute; left: 15%; width: 70%; top: 60.4%; text-align: center; white-space: nowrap; font-size: 0.6em; letter-spacing: 0.02em; text-transform: uppercase; color: var(--tt); }
.tcard .tctxt { position: absolute; left: 14.5%; width: 71%; top: 64.4%; height: 25.4%; margin: 0px; padding: 0.05em 0.25em; background: none; color: rgb(43, 27, 16); text-align: center; font-size: 0.66em; line-height: 1.1; display: flex; flex-direction: column; justify-content: safe center; gap: 0.2em; overflow: hidden; }
.tcard .tcfl { opacity: 0.7; }
.tcard .tctag { display: none; }
#stage{position:fixed;inset:0;touch-action:none;user-select:none}
.cw{position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 60%;pointer-events:none}

.cw.drag .tcard{box-shadow:0 1.6em 2.4em rgba(0,0,0,.7)!important}
.cw .glowring{position:absolute;inset:-6px;border-radius:10px;box-shadow:0 0 0 3px rgba(246,214,106,0),0 0 0 rgba(246,214,106,0);transition:box-shadow .15s;pointer-events:none}
.cw.hot .glowring{box-shadow:0 0 0 3px #f6d66a,0 0 26px 6px rgba(246,214,106,.7)}
.cw.hov .glowring{box-shadow:0 0 18px 2px rgba(246,214,106,.45)}
#zone{position:absolute;left:50%;top:150px;width:420px;height:250px;margin-left:-210px;border:4px dashed #5a4a30;border-radius:18px;display:grid;place-items:center;text-align:center;padding:0 30px;color:#8a7a5a;font-size:30px;letter-spacing:.1em;transition:all .15s;text-transform:uppercase}
#zone.hot{border-color:#f6d66a;color:#f6d66a;background:rgba(246,214,106,.1);box-shadow:0 0 40px rgba(246,214,106,.25);transform:scale(1.03)}
#deck{position:absolute;right:60px;bottom:50px;width:150px;height:228px;cursor:pointer}
#deck .pile{position:absolute;inset:0;border-radius:8px;background:linear-gradient(#5a1a28,#2a0a12);border:5px solid #c9a85a;box-shadow:0 0 0 3px #14110d;display:grid;place-items:center;font-size:44px;color:#f6d66a;text-shadow:0 3px 0 #000;transition:transform .12s}
#deck:hover .pile{transform:translateY(-4px) rotate(-1deg)}
#deck .p2{transform:translate(-4px,-4px)}#deck .p3{transform:translate(-8px,-8px)}
#deck small{position:absolute;left:0;right:0;bottom:-30px;text-align:center;color:#a09c8c;font-size:22px}
#disc{position:absolute;left:60px;bottom:50px;width:150px;height:228px;border:4px dashed #3a342a;border-radius:10px;display:grid;place-items:center;color:#5a5446;font-size:22px;text-transform:uppercase}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.pt{position:absolute;width:10px;height:10px;background:#f6d66a;border-radius:2px;will-change:transform,opacity}
#panel{position:fixed;left:14px;top:14px;width:290px;background:rgba(14,12,10,.88);border:4px solid #50515f;padding:10px 12px;z-index:60;max-height:calc(100% - 28px);overflow:auto}
#panel h1{margin:0 0 6px;font-size:28px;font-weight:400}
#panel label{display:grid;grid-template-columns:1fr 54px;gap:2px 8px;font-size:19px;margin:5px 0;color:#c8bfa5}
#panel input[type=range]{grid-column:1/-1;width:100%;accent-color:#cf8a30}
#panel b{text-align:right;color:#f6d66a;font-weight:400}
#panel button{font:inherit;font-size:20px;padding:6px 12px;margin:3px 3px 0 0;background:#2a2630;color:#dcd6c6;border:3px solid #50515f;cursor:pointer}
#panel button:hover{border-color:#cf8a30}
#panel .hint{font-size:17px;color:#8d8470;margin-top:8px;line-height:1.2}
#log{position:fixed;right:14px;top:14px;font-size:22px;color:#f6d66a;text-align:right;z-index:60;pointer-events:none;text-shadow:0 2px 0 #000}
</style></head><body>
<div id="stage">
  <div id="zone">Drop a card here to play it</div>
  <div id="disc">discard</div>
  <div id="deck"><div class="pile p3"></div><div class="pile p2"></div><div class="pile"><span>DRAW</span></div><small id="dcount"></small></div>
</div>
<div id="fx"></div><div id="log"></div>
<div id="panel">
  <h1>Card lab</h1>
  <div><button id="bDraw">Draw</button><button id="bFull">Draw 5</button><button id="bReset">Reset</button><button id="bCopy">Copy settings</button></div>
  <div id="sliders"></div>
  <div class="hint">Drag a card onto the zone to play it. Click the deck to draw. Cards use the game's real card art. Everything here is a slider: tune it until it feels right, press Copy settings and send them to me.</div>
</div>

  var c={id:++uid,card:card,el:w,x:fromX,y:fromY,r:-20,s:.5,vx:0,vy:0,vr:0,vs:0,ph:Math.random()*6.28,born:performance.now(),state:'hand',z:0};hand.push(c);return c}
function slot(i,n){
  var mid=(n-1)/2,o=i-mid,sp=Math.min(P.spread,(W-480)/Math.max(1,n));
  var x=W/2+o*sp,y=H-P.cw*1.523*0.58+Math.abs(o)*Math.abs(o)*(P.arc/Math.max(1,n/2))*.35,r=o*P.fan;
  return {x:x,y:y,r:r}}
function layout(){return hand.filter(function(c){return c.state==='hand'})}
function targetFor(c,i,list,t){
  var n=list.length,sl_=slot(i,n),tx=sl_.x,ty=sl_.y,tr=sl_.r,ts=1;
  var fl=Math.sin(t/900+c.ph)*P.float;ty+=fl;
  if(drag&&drag.c===c){tx=ptr.x-drag.dx;ty=ptr.y-drag.dy;ts=P.dragScale;tr=Math.max(-25,Math.min(25,ptr.vx*.018*P.tilt));return{x:tx,y:ty,r:tr,s:ts}}
  if(hov>=0&&!drag){
    if(i===hov){ty-=P.lift;ts=P.hovScale;tr=0;tx+=0}
    else{var dd=i-hov;tx+=Math.sign(dd)*P.neighbour/Math.max(1,Math.abs(dd))*(Math.abs(dd)<4?1:0)}}
  return{x:tx,y:ty,r:tr,s:ts}}
var last=performance.now();
function frame(now){
  var dt=Math.min(.033,(now-last)/1000);last=now;var list=layout();
  hand.forEach(function(c){
    var i=list.indexOf(c),T;
    if(c.state==='play'){T={x:c.tx,y:c.ty,r:0,s:1.35}}
    else if(c.state==='dead')return;
    else T=targetFor(c,i,list,now);
    var k=P.k,d=P.d;
    c.vx+=((T.x-c.x)*k-c.vx*d)*dt;c.x+=c.vx*dt;
    c.vy+=((T.y-c.y)*k-c.vy*d)*dt;c.y+=c.vy*dt;
    c.vr+=((T.r-c.r)*k*1.2-c.vr*d)*dt;c.r+=c.vr*dt;
    c.vs+=((T.s-c.s)*k*1.4-c.vs*d)*dt;c.s+=c.vs*dt;
    var z=(drag&&drag.c===c)?1000:(i===hov&&!drag)?500:(c.state==='play'?900:i);
    c.el.firstChild.style.setProperty('--cw',P.cw+'px');c.el.style.zIndex=z;
    c.el.style.transform='translate('+(c.x-P.cw/2).toFixed(1)+'px,'+(c.y-P.cw*1.523/2).toFixed(1)+'px) rotate('+c.r.toFixed(2)+'deg) scale('+Math.max(0,c.s).toFixed(3)+')';
    c.el.classList.toggle('hov',i===hov&&!drag);
  });
  ptr.vx*=.86;ptr.vy*=.86;
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function draw(){
  if(!pile.length)refill();var card=pile.pop(),r=deckEl.getBoundingClientRect();
  var c=mk(card,r.left+r.width/2,r.top+r.height/2);c.r=10;document.getElementById('dcount').textContent=pile.length+' in deck';return c}
function drawN(n){for(var i=0;i<n;i++)(function(i){setTimeout(function(){if(layout().length<9)draw()},i*P.drawMs)})(i)}
deckEl.onclick=function(){if(layout().length<9)draw()};
document.getElementById('bDraw').onclick=function(){draw()};
document.getElementById('bFull').onclick=function(){drawN(5)};
document.getElementById('bReset').onclick=function(){hand.forEach(function(c){c.el.remove()});hand=[];refill();Object.assign(P,JSON.parse(DEF));SL.forEach(function(s){var l=sl.querySelector('[data-k='+s[0]+']');l.querySelector('input').value=P[s[0]];l.querySelector('b').textContent=P[s[0]]});drawN(5)};
document.getElementById('bCopy').onclick=function(){var t=JSON.stringify(P);try{navigator.clipboard.writeText(t)}catch(e){}say('Settings copied');prompt&&0;console.log(t)};
function hoverFromPtr(){
  if(drag){hov=-1;return}
  var list=layout(),n=list.length;if(!n){hov=-1;return}
  var zoneTop=H-P.cw*1.523-40;
  if(ptr.y<zoneTop+(hov>=0?-P.lift*.5:0)||ptr.x<0){hov=-1;return}
  var best=-1,bd=1e9;list.forEach(function(c,i){var s=slot(i,n),dd=Math.abs(ptr.x-s.x);if(dd<bd){bd=dd;best=i}});
  var s0=slot(best,n),half=Math.max(P.spread,60)*.62+(best===0||best===n-1?P.cw*.3:0);
  hov=(bd<=half+ (hov===best?20:0))?best:-1}
stage.addEventListener('pointermove',function(e){var now=performance.now(),dt=Math.max(1,now-ptr.t);ptr.vx=(e.clientX-ptr.x)/dt*1000*.5+ptr.vx*.5;ptr.vy=(e.clientY-ptr.y)/dt*1000*.5;ptr.x=e.clientX;ptr.y=e.clientY;ptr.t=now;hoverFromPtr();
  if(drag){var zr=zone.getBoundingClientRect(),over=ptr.x>zr.left&&ptr.x<zr.right&&ptr.y>zr.top&&ptr.y<zr.bottom;zone.classList.toggle('hot',over);drag.c.el.classList.toggle('hot',over)}});
stage.addEventListener('pointerdown',function(e){
  ptr.x=e.clientX;ptr.y=e.clientY;hoverFromPtr();if(hov<0)return;var c=layout()[hov];if(!c)return;
  stage.setPointerCapture(e.pointerId);
  drag={c:c,dx:e.clientX-c.x,dy:e.clientY-c.y};c.el.classList.add('drag');hov=-1});
stage.addEventListener('pointerup',function(e){
  if(!drag)return;var c=drag.c;drag=null;c.el.classList.remove('drag','hot');zone.classList.remove('hot');
  var zr=zone.getBoundingClientRect();
  if(ptr.x>zr.left&&ptr.x<zr.right&&ptr.y>zr.top&&ptr.y<zr.bottom)play(c);
  hoverFromPtr()});
stage.addEventListener('pointerleave',function(){if(!drag)hov=-1});
function burst(x,y,col){
  for(var i=0;i<26;i++){var p=document.createElement('i');p.className='pt';p.style.background=col||'#f6d66a';fx.appendChild(p);var a=Math.random()*6.283,v=140+Math.random()*340,life=500+Math.random()*500,t0=performance.now();
    (function(p,a,v,life,t0){function s(n){var u=(n-t0)/life;if(u>=1){p.remove();return}var dx=Math.cos(a)*v*u,dy=Math.sin(a)*v*u+260*u*u;p.style.transform='translate('+(x+dx)+'px,'+(y+dy)+'px) scale('+(1-u)+') rotate('+(u*360)+'deg)';p.style.opacity=1-u*u;requestAnimationFrame(s)}requestAnimationFrame(s)})(p,a,v,life,t0)}}
function play(c){
  var zr=zone.getBoundingClientRect();c.state='play';c.tx=zr.left+zr.width/2;c.ty=zr.top+zr.height/2;played++;say(c.card.name+' played ('+played+')');
  setTimeout(function(){burst(c.tx,c.ty);c.el.style.transition='opacity .25s';c.el.style.opacity=0},330);
  setTimeout(function(){c.state='dead';c.el.remove();hand=hand.filter(function(x){return x!==c})},650)}
addEventListener('resize',function(){W=innerWidth;H=innerHeight});
refill();setTimeout(function(){drawN(5)},300);
</script></body></html>
